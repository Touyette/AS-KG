<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The typed graph — Attachment Theory Knowledge Graph</title>
<meta name="description" content="An ego-centric explorer over the typed attachment graph: open on one idea and walk outward along what triggers, defends against, mirrors or heals it.">
<style>
:root{
  --bg:#f6f5f4; --panel:#fffefd; --line:#e2ded9; --ink:#26242b; --dim:#6d6a75;
  --faint:#a5a1ad; --accent:#7b4bd8; --halo:#fffefd; --shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
}
:root[data-theme="dark"], :root:not([data-theme="light"]){}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131318; --panel:#1b1b22; --line:#2c2c36; --ink:#e9e7ee; --dim:#9d9aa8;
    --faint:#66636f; --accent:#b39bff; --halo:#131318; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#131318; --panel:#1b1b22; --line:#2c2c36; --ink:#e9e7ee; --dim:#9d9aa8;
  --faint:#66636f; --accent:#b39bff; --halo:#131318; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 "Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
a{color:inherit}
button,select,input{font:inherit;color:inherit}

header{
  display:flex; align-items:center; gap:.75rem; padding:.6rem .9rem;
  border-bottom:1px solid var(--line); background:var(--panel); flex:none; flex-wrap:wrap;
}
header h1{font:600 15px/1 "Schibsted Grotesk",system-ui,sans-serif; margin:0; letter-spacing:-.01em}
header .home{text-decoration:none; color:var(--dim); font-size:13px; white-space:nowrap}
header .home:hover{color:var(--ink)}
header .spacer{flex:1}
.modes{display:flex; background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:2px}
.modes button{
  border:0; background:none; padding:.25rem .8rem; border-radius:999px;
  font-size:13px; color:var(--dim); cursor:pointer;
}
.modes button[aria-selected="true"]{background:var(--accent); color:#fff}
.btn{
  border:1px solid var(--line); background:var(--panel); border-radius:7px;
  padding:.3rem .65rem; font-size:13px; cursor:pointer; color:var(--dim);
}
.btn:hover{color:var(--ink); border-color:var(--faint)}

#why{
  flex:none; padding:.55rem .9rem; background:color-mix(in srgb, var(--accent) 10%, var(--panel));
  border-bottom:1px solid var(--line); font-size:14px; display:flex; gap:.6rem; align-items:baseline;
}
#why b{font-weight:600; color:var(--accent); flex:none; font-size:12px; text-transform:uppercase; letter-spacing:.06em}
#why[hidden]{display:none}

main{flex:1; display:flex; min-height:0}
aside{
  width:274px; flex:none; background:var(--panel); overflow-y:auto; padding:.9rem;
  display:flex; flex-direction:column; gap:1.1rem;
}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line); width:322px}
aside h2{font:600 11px/1 "Schibsted Grotesk",system-ui,sans-serif; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); margin:0 0 .55rem}

#q{
  width:100%; padding:.5rem .65rem; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); outline:none;
}
#q:focus{border-color:var(--accent)}
#results{list-style:none; margin:.4rem 0 0; padding:0; max-height:264px; overflow-y:auto}
#results li{padding:.4rem .5rem; border-radius:6px; cursor:pointer; font-size:13.5px; line-height:1.35}
#results li:hover,#results li.on{background:color-mix(in srgb, var(--accent) 12%, transparent)}
#results .t{display:block; font-size:11px; color:var(--faint)}

.chips{display:flex; flex-wrap:wrap; gap:.3rem}
.chip{
  display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--line);
  background:var(--bg); border-radius:999px; padding:.2rem .6rem; font-size:12.5px;
  cursor:pointer; color:var(--dim);
}
.chip[aria-pressed="true"]{color:var(--ink); border-color:var(--faint)}
.chip:not([aria-pressed="true"]) .dot{opacity:.25}
.dot{width:8px; height:8px; border-radius:50%; flex:none; display:inline-block}

select{
  width:100%; padding:.42rem .5rem; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); cursor:pointer;
}
#cycles{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.25rem}
#cycles button{
  width:100%; text-align:left; border:1px solid var(--line); background:var(--bg);
  border-radius:7px; padding:.4rem .55rem; font-size:13px; cursor:pointer; line-height:1.35;
}
#cycles button:hover{border-color:var(--accent)}
#cycles .n{color:var(--faint); font-size:11px}

#stage{flex:1; position:relative; min-width:0; background:var(--bg)}
#svg{width:100%; height:100%; display:block; cursor:grab; touch-action:none}
#svg.drag{cursor:grabbing}
#hint{
  position:absolute; left:.75rem; bottom:.6rem; font-size:12px; color:var(--faint);
  pointer-events:none; display:flex; gap:.75rem; align-items:center;
}
#hint button{pointer-events:auto}
#legend{
  position:absolute; right:.75rem; bottom:.6rem; display:flex; flex-direction:column; gap:.2rem;
  font-size:11px; color:var(--dim); background:color-mix(in srgb, var(--panel) 82%, transparent);
  border:1px solid var(--line); border-radius:8px; padding:.45rem .55rem; pointer-events:none;
}
#legend span{display:flex; align-items:center; gap:.35rem}

.node{cursor:pointer}
.node circle{stroke:var(--halo); stroke-width:2; transition:opacity .12s}
.node text{
  font:11.5px/1 "Source Sans Pro",system-ui,sans-serif; fill:var(--ink);
  paint-order:stroke; stroke:var(--halo); stroke-width:3.5px; stroke-linejoin:round;
  pointer-events:none;
}
.node.focus text{font-weight:600; font-size:13px}
.node.faded{opacity:.22}
/* discussion mode: the chosen nodes are the claim, the rest is orientation */
.node.dim{opacity:.5}
.node.pick circle{stroke:var(--accent); stroke-width:2.5}
.node.hot circle{stroke:var(--accent); stroke-width:2.5}
.edge{fill:none; stroke-linecap:round}
.edge.faded{opacity:.07}
.elabel{font:10px/1 "IBM Plex Mono",ui-monospace,monospace; fill:var(--dim); paint-order:stroke; stroke:var(--halo); stroke-width:3px; pointer-events:none}

#detail .empty-note{color:var(--dim); font-size:13.5px}
#detail h3{font:600 19px/1.25 "Schibsted Grotesk",system-ui,sans-serif; margin:0 0 .35rem; letter-spacing:-.01em}
#detail .meta{display:flex; flex-wrap:wrap; gap:.3rem; margin-bottom:.6rem}
.tag{font-size:11px; padding:.13rem .45rem; border-radius:5px; background:var(--bg); border:1px solid var(--line); color:var(--dim)}
.tag.type{color:#fff; border:0}
#detail p.gloss{margin:0 0 .8rem; font-size:14px; color:var(--ink)}
#detail .acts{display:flex; gap:.4rem; margin-bottom:1rem; flex-wrap:wrap}
#detail .rel{margin-bottom:.7rem}
#detail .rel h4{
  font:600 11px/1 "IBM Plex Mono",monospace; margin:0 0 .25rem; letter-spacing:.02em;
}
#detail .rel ul{list-style:none; margin:0; padding:0}
#detail .rel li{padding:.13rem 0; font-size:13.5px; line-height:1.4}
#detail .rel a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); cursor:pointer}
#detail .rel a:hover{border-color:var(--accent); color:var(--accent)}
#detail .rel .ts{font-size:11px; color:var(--faint); text-decoration:none; border:0; margin-left:.25rem}
#detail .lensrow{display:grid; grid-template-columns:1fr auto; gap:.1rem .5rem; font-size:12.5px; margin-bottom:.9rem}
#detail .lensrow span:nth-child(even){color:var(--dim)}

#loading{position:absolute; inset:0; display:grid; place-items:center; color:var(--dim); font-size:14px}

@media (max-width:1080px){
  #right{width:280px} aside{width:240px}
}
@media (max-width:840px){
  main{flex-direction:column; overflow-y:auto}
  aside{width:auto; border:0; border-bottom:1px solid var(--line)}
  #right{border-top:1px solid var(--line)}
  #stage{min-height:60vh}
}
</style>
</head>
<body>
<header>
  <a class="home" href="..">← Site</a>
  <h1>The typed graph</h1>
  <div class="modes" id="modes" role="tablist">
    <button data-mode="explore" role="tab">Explore</button>
    <button data-mode="discussion" role="tab">Discussion</button>
  </div>
  <div class="spacer"></div>
  <a class="btn" href="../agent/">For agents</a>
  <button class="btn" id="copy" title="Copy a link to exactly this view">Copy link</button>
  <button class="btn" id="theme" title="Light / dark">◐</button>
</header>

<div id="why" hidden><b>In discussion</b><span id="whytext"></span></div>

<main>
  <aside id="left">
    <section>
      <h2>Find</h2>
      <input id="q" placeholder="Search titles, aliases…" autocomplete="off" spellcheck="false">
      <ul id="results"></ul>
    </section>
    <section>
      <h2>Relationships</h2>
      <div class="chips" id="groups"></div>
    </section>
    <section>
      <h2>Lens</h2>
      <select id="lens"></select>
    </section>
    <section>
      <h2>Neighbourhood</h2>
      <select id="depth">
        <option value="0">Just the focus</option>
        <option value="1">One hop</option>
        <option value="2">Two hops</option>
      </select>
    </section>
    <section>
      <h2>Loops</h2>
      <ul id="cycles"></ul>
    </section>
  </aside>

  <div id="stage">
    <svg id="svg"></svg>
    <div id="legend"></div>
    <div id="hint"></div>
    <div id="loading">Loading the graph…</div>
  </div>

  <aside id="right"><div id="detail"></div></aside>
</main>

<script src="explorer.js"></script>
</body>
</html>
