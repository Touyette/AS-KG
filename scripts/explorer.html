<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The typed graph — Attachment Theory Knowledge Graph</title>
<meta name="description" content="An ego-centric explorer over the typed attachment graph: colour is the attachment style, shape is the kind of node, and you walk outward from one idea along what triggers, defends against, mirrors or heals it.">
<style>
:root{
  --bg:#f6f5f4; --panel:#fffefd; --line:#e2ded9; --ink:#26242b; --dim:#6a6875;
  --faint:#9d99a6; --accent:#7b4bd8; --halo:#fffefd;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131318; --panel:#1b1b22; --line:#2c2c36; --ink:#e9e7ee; --dim:#9d9aa8;
    --faint:#6b6875; --accent:#b39bff; --halo:#131318;
  }
}
:root[data-theme="dark"]{
  --bg:#131318; --panel:#1b1b22; --line:#2c2c36; --ink:#e9e7ee; --dim:#9d9aa8;
  --faint:#6b6875; --accent:#b39bff; --halo:#131318;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:15px/1.5 "Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
a{color:inherit}
button,select,input{font:inherit;color:inherit}

header{
  display:flex; align-items:center; gap:.75rem; padding:.6rem .9rem;
  border-bottom:1px solid var(--line); background:var(--panel); flex:none; flex-wrap:wrap;
}
header h1{font:600 15px/1 "Schibsted Grotesk",system-ui,sans-serif; margin:0; letter-spacing:-.01em}
header .home{text-decoration:none; color:var(--dim); font-size:13px; white-space:nowrap}
header .home:hover{color:var(--ink)}
header .spacer{flex:1}
.btn{
  border:1px solid var(--line); background:var(--panel); border-radius:7px;
  padding:.3rem .65rem; font-size:13px; cursor:pointer; color:var(--dim); text-decoration:none;
  display:inline-block;
}
.btn:hover{color:var(--ink); border-color:var(--faint)}
.btn.on{background:var(--accent); color:#fff; border-color:var(--accent)}

/* an assistant chose these nodes — say so, rather than making it a mode you set */
#why{
  flex:none; padding:.55rem .9rem; background:color-mix(in srgb, var(--accent) 10%, var(--panel));
  border-bottom:1px solid var(--line); font-size:14px; display:flex; gap:.7rem; align-items:center;
}
#why b{
  font-weight:600; color:var(--accent); flex:none; font-size:11px;
  text-transform:uppercase; letter-spacing:.07em;
}
#why span.t{flex:1}
#why[hidden]{display:none}

main{flex:1; display:flex; min-height:0}
aside{
  width:278px; flex:none; background:var(--panel); overflow-y:auto; padding:.9rem;
  display:flex; flex-direction:column; gap:1.05rem;
}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line); width:330px}
aside h2{
  font:600 11px/1 "Schibsted Grotesk",system-ui,sans-serif; text-transform:uppercase;
  letter-spacing:.08em; color:var(--faint); margin:0 0 .55rem;
  display:flex; align-items:center; gap:.35rem;
}
.info{
  display:inline-grid; place-items:center; width:14px; height:14px; border-radius:50%;
  border:1px solid var(--faint); font-size:9px; font-weight:700; cursor:help;
  font-family:"Source Sans Pro",sans-serif; letter-spacing:0; text-transform:none;
}
.info:hover{border-color:var(--accent); color:var(--accent)}

#q{
  width:100%; padding:.5rem .65rem; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); outline:none;
}
#q:focus{border-color:var(--accent)}
#results{list-style:none; margin:.4rem 0 0; padding:0; max-height:250px; overflow-y:auto}
#results li{padding:.4rem .5rem; border-radius:6px; cursor:pointer; font-size:13.5px; line-height:1.35}
#results li:hover{background:color-mix(in srgb, var(--accent) 12%, transparent)}
#results .t{display:block; font-size:11px; color:var(--faint)}

.chips{display:flex; flex-wrap:wrap; gap:.3rem}
.chip{
  display:inline-flex; align-items:center; gap:.35rem; border:1px solid var(--line);
  background:var(--bg); border-radius:999px; padding:.22rem .62rem; font-size:12.5px;
  cursor:pointer; color:var(--dim);
}
.chip[aria-pressed="true"]{color:var(--ink); border-color:var(--faint)}
.chip:not([aria-pressed="true"]){opacity:.5}
.chip:not([aria-pressed="true"]) .dot{opacity:.3}
.dot{width:9px; height:9px; border-radius:50%; flex:none; display:inline-block}
.styles .chip{width:calc(50% - .15rem); justify-content:flex-start}

select{
  width:100%; padding:.42rem .5rem; border:1px solid var(--line); border-radius:8px;
  background:var(--bg); cursor:pointer;
}
#cycles{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:.28rem}
#cycles button{
  width:100%; text-align:left; border:1px solid var(--line); background:var(--bg);
  border-radius:7px; padding:.42rem .55rem; font-size:12.5px; cursor:pointer; line-height:1.4;
}
#cycles button:hover{border-color:var(--accent)}
#cycles .sw{display:flex; gap:.2rem; margin-bottom:.25rem}
#cycles .n{color:var(--faint); font-size:11px}

#stage{flex:1; position:relative; min-width:0; background:var(--bg)}
#svg{width:100%; height:100%; display:block; cursor:grab; touch-action:none}
#svg.drag{cursor:grabbing}
#hint{
  position:absolute; left:.75rem; bottom:.6rem; font-size:12px; color:var(--faint);
  display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; max-width:60%;
}
#legend{
  position:absolute; right:.75rem; bottom:.6rem; font-size:11px; color:var(--dim);
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  border:1px solid var(--line); border-radius:8px; padding:.5rem .6rem; pointer-events:none;
  display:flex; gap:.9rem; align-items:flex-start; max-width:52%;
}
#legend .col{display:flex; flex-direction:column; gap:.22rem}
#legend h3{margin:0 0 .15rem; font:600 9.5px/1 "Schibsted Grotesk",sans-serif;
  text-transform:uppercase; letter-spacing:.07em; color:var(--faint)}
#legend .row{display:flex; align-items:center; gap:.35rem; white-space:nowrap}
#legend svg{flex:none}

.node{cursor:pointer}
.node .glyph{stroke:var(--halo); stroke-width:1.8; transition:opacity .12s}
.node text{
  font:11.5px/1 "Source Sans Pro",system-ui,sans-serif; fill:var(--ink);
  paint-order:stroke; stroke:var(--halo); stroke-width:3.5px; stroke-linejoin:round;
  pointer-events:none;
}
.node.focus text{font-weight:600; font-size:13px}
.node.faded{opacity:.2}
.node.hot .glyph{stroke:var(--accent); stroke-width:2.4}
.node.picked .glyph{stroke:var(--accent); stroke-width:2.6}
.node.dim{opacity:.5}
.edge{fill:none; stroke-linecap:round}
.edge.faded{opacity:.06}
.elabel{font:10px/1 "IBM Plex Mono",ui-monospace,monospace; fill:var(--dim);
  paint-order:stroke; stroke:var(--halo); stroke-width:3px; pointer-events:none}

#detail .empty-note{color:var(--dim); font-size:13.5px}
#detail h3{font:600 19px/1.25 "Schibsted Grotesk",system-ui,sans-serif; margin:0 0 .35rem; letter-spacing:-.01em}
#detail .meta{display:flex; flex-wrap:wrap; gap:.3rem; margin-bottom:.6rem; align-items:center}
.tag{font-size:11px; padding:.13rem .45rem; border-radius:5px; background:var(--bg);
  border:1px solid var(--line); color:var(--dim); display:inline-flex; align-items:center; gap:.3rem}
.tag.style{border:0; color:#fff}
#detail p.gloss{margin:0 0 .8rem; font-size:14px}
#detail .acts{display:flex; gap:.4rem; margin-bottom:1rem; flex-wrap:wrap}
#detail h2{font:600 11px/1 "Schibsted Grotesk",sans-serif; text-transform:uppercase;
  letter-spacing:.08em; color:var(--faint); margin:0 0 .5rem}
#detail .rel{margin-bottom:.7rem}
#detail .rel h4{font:600 11px/1 "IBM Plex Mono",monospace; margin:0 0 .25rem}
#detail .rel ul{list-style:none; margin:0; padding:0}
#detail .rel li{padding:.13rem 0; font-size:13.5px; line-height:1.4}
#detail .rel a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line); cursor:pointer}
#detail .rel a:hover{border-color:var(--accent); color:var(--accent)}
#detail .rel .ts{font-size:11px; color:var(--faint); border:0; margin-left:.25rem}
#detail .lensrow{display:grid; grid-template-columns:auto 1fr auto; gap:.16rem .5rem;
  font-size:12.5px; margin-bottom:.9rem; align-items:center}
#detail .lensrow .v{color:var(--dim); text-align:right}
#detail ul.multi{list-style:none; margin:0 0 1rem; padding:0}
#detail ul.multi li{display:flex; align-items:center; gap:.45rem; padding:.2rem 0; font-size:13.5px}
#detail ul.multi button{border:0; background:none; color:var(--faint); cursor:pointer; padding:0 .2rem}
#detail ul.multi button:hover{color:var(--accent)}

/* the note, read without leaving the graph */
#reader{
  position:absolute; inset:0 0 0 auto; width:min(560px,86%); background:var(--panel);
  border-left:1px solid var(--line); box-shadow:-12px 0 40px rgba(0,0,0,.10);
  display:flex; flex-direction:column; z-index:5;
}
#reader[hidden]{display:none}
#reader .bar{
  display:flex; align-items:center; gap:.6rem; padding:.6rem .9rem;
  border-bottom:1px solid var(--line); flex:none;
}
#reader .bar strong{font:600 14px/1.3 "Schibsted Grotesk",sans-serif; flex:1}
#reader .body{padding:1rem 1.15rem 2.5rem; overflow-y:auto; font-size:14.5px; line-height:1.62}
#reader .body h1{font:600 22px/1.25 "Schibsted Grotesk",sans-serif; margin:0 0 .6rem}
#reader .body h2,#reader .body h3{font:600 15px/1.3 "Schibsted Grotesk",sans-serif; margin:1.3rem 0 .4rem}
#reader .body a{color:var(--accent)}
#reader .body ul{padding-left:1.1rem}
#reader .body blockquote{margin:.8rem 0; padding:.5rem .8rem; border-left:2px solid var(--line); color:var(--dim)}
#reader .body img{max-width:100%}

#loading{position:absolute; inset:0; display:grid; place-items:center; color:var(--dim);
  font-size:14px; pointer-events:none}

@media (max-width:1080px){ #right{width:290px} aside{width:250px} }
@media (max-width:840px){
  main{flex-direction:column; overflow-y:auto}
  aside{width:auto; border:0; border-bottom:1px solid var(--line)}
  #right{border-top:1px solid var(--line)}
  #stage{min-height:62vh}
  #legend{display:none}
}
</style>
</head>
<body>
<header>
  <a class="home" href="__BASE__/" data-router-ignore>← Site</a>
  <h1>The typed graph</h1>
  <div class="spacer"></div>
  <a class="btn" href="__BASE__/agent/" data-router-ignore>For agents</a>
  <button class="btn" id="copy" title="Copy a link to exactly this view">Copy link</button>
  <button class="btn" id="theme" title="Light / dark">◐</button>
</header>

<div id="why" hidden>
  <b>Picked for you</b>
  <span class="t" id="whytext"></span>
  <button class="btn" id="leavewhy">Explore from here</button>
</div>

<main>
  <aside id="left">
    <section>
      <h2>Find</h2>
      <input id="q" placeholder="Search titles, aliases…" autocomplete="off" spellcheck="false">
      <ul id="results"></ul>
    </section>

    <section>
      <h2>Attachment style
        <span class="info" tabindex="0" title="Colour is the style a node belongs to. Nodes that belong to more than one are grey — they are not style-specific. Turning a style off hides everything that only belongs to it.">i</span>
      </h2>
      <div class="chips styles" id="styles"></div>
    </section>

    <section>
      <h2>Neighbourhood</h2>
      <select id="depth">
        <option value="0">Just the selection</option>
        <option value="1">One hop</option>
        <option value="2">Two hops</option>
      </select>
    </section>

    <section>
      <h2>Relationships
        <span class="info" tabindex="0" title="The sixteen link types, grouped into five families. Turning a family off removes those arrows and any node only reachable through them.">i</span>
      </h2>
      <div class="chips" id="groups"></div>
    </section>

    <section>
      <h2>Loops
        <span class="info" tabindex="0" title="A closed chain in the causal links: A fires B, B fires C, C fires A again. They are found by searching the graph, not asserted — this is why the material is modelled as a directed graph at all. The swatches show which styles the loop runs in.">i</span>
      </h2>
      <ul id="cycles"></ul>
    </section>
  </aside>

  <div id="stage">
    <svg id="svg"></svg>
    <div id="legend"></div>
    <div id="hint"></div>
    <div id="loading">Loading the graph…</div>
    <div id="reader" hidden>
      <div class="bar">
        <strong id="readerTitle"></strong>
        <a class="btn" id="readerOpen" href="#" data-router-ignore>Full page ↗</a>
        <button class="btn" id="readerClose" title="Close">✕</button>
      </div>
      <div class="body" id="readerBody"></div>
    </div>
  </div>

  <aside id="right"><div id="detail"></div></aside>
</main>

<script>
  // If this page is reached through Quartz's SPA router the script below can be
  // re-inserted against the wrong base and 404 silently. Do not leave someone
  // staring at a spinner when that happens.
  setTimeout(function () {
    if (window.__askgReady) return;
    var el = document.getElementById('loading');
    if (!el) return;
    el.style.pointerEvents = 'auto';
    el.innerHTML =
      '<div style="max-width:30rem;text-align:center;padding:1.25rem">' +
      '<p style="font-weight:600;margin:0 0 .4rem">The graph did not start.</p>' +
      '<p style="margin:0 0 1rem;color:var(--dim);font-size:13.5px">Its script or its data did not load. ' +
      'Reloading this page directly usually fixes it.</p>' +
      '<a class="btn" data-router-ignore href="' + location.pathname + location.search + location.hash + '">Reload the page</a></div>';
  }, 9000);
</script>
<script src="__BASE__/typed-graph/explorer.js"></script>
</body>
</html>
